replicaCount: 2

image:
  repository: ghcr.io/sumanthbolle/deployd
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# The chart does not run PostgreSQL. Point it at a managed database
# (RDS, Cloud SQL, CloudNativePG ...) through an existing Secret that holds
# DATABASE_URL and DEPLOYD_TOKENS.
existingSecret: deployd-secrets

config:
  logLevel: info
  workers: "4"
  maxSurge: "1"
  failureThreshold: "3"

# Optional mutual TLS. The Secret must hold tls.crt, tls.key and ca.crt.
tls:
  enabled: false
  secretName: deployd-tls
  requireClientCert: true

service:
  type: ClusterIP
  port: 8080

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

podDisruptionBudget:
  minAvailable: 1

# Creates a Prometheus Operator ServiceMonitor when true.
serviceMonitor:
  enabled: false
