# Local stack: PostgreSQL plus two deployd replicas sharing one queue.
#   docker compose up --build
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: deployd
      POSTGRES_PASSWORD: deployd
      POSTGRES_DB: deployd
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployd"]
      interval: 2s
      retries: 20

  deployd-a: &deployd
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://deployd:deployd@postgres:5432/deployd?sslmode=disable
      DEPLOYD_TOKENS: dev-viewer:viewer,dev-deployer:deployer
      DEPLOYD_LOG_LEVEL: debug
    ports: ["8080:8080", "9090:9090"]

  deployd-b:
    <<: *deployd
    ports: ["8081:8080", "9091:9090"]
